map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"olist-web"}';
    }

    location = /dashboard {
        return 308 /dashboard/;
    }

    location /dashboard/ {
        # Volver a resolver el servicio cuando Docker recrea su contenedor.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dashboard_upstream dashboard:8050;
        proxy_pass http://$dashboard_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_read_timeout 180s;
        proxy_redirect off;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
